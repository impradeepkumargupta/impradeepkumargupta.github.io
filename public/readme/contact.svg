  <text x="678" y="138" class="text-bold">Google Cloud Certified</text>
  <text x="678" y="156" class="link">Professional Cloud Architect ↗</text>

  <!-- Detail Item 3 -->
  <rect x="626" y="176" width="38" height="38" rx="10" class="blue-box" />
  <text x="645" y="200" text-anchor="middle" class="mono-blue">EN</text>
  <text x="678" y="192" class="text-bold">IELTS Overall 7.0 (Sept 30, 2025)</text>
  <text x="678" y="210" class="body-xs">C1 · Proficient English</text>

  <line x1="626" y1="232" x2="1016" y2="232" class="divider" />
  <text x="626" y="254" class="faint">Open to</text>
  <text x="626" y="278" class="text-bold">United States  ·  European Union  ·  Australia  ·  Remote Worldwide</text>

  <!-- Contact Section Header -->
  <line x1="24" y1="360" x2="1056" y2="360" class="divider" />
  <text x="24" y="400" class="eyebrow">Get in Touch</text>
  <text x="24" y="436" class="h2">Contact &amp; Verified Profiles</text>

