  <text x="394" y="512" class="text-bold">+91 8604932809 ↗</text>

  <rect x="724" y="462" width="332" height="68" rx="12" class="card" />
  <text x="744" y="488" class="faint">LinkedIn</text>
  <text x="744" y="512" class="text-bold">linkedin.com/in/impradeepkumargupta ↗</text>

  <rect x="24" y="544" width="332" height="68" rx="12" class="card" />
  <text x="44" y="570" class="faint">GitHub</text>
  <text x="44" y="594" class="text-bold">github.com/impradeepkumargupta ↗</text>

