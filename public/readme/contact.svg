<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="100%">
  
  <defs>
    <style>
      .card { fill: #f8f9fa; stroke: #e8eaed; stroke-width: 1; }
      .card-white { fill: #ffffff; stroke: #e8eaed; stroke-width: 1; }
      .chip { fill: #ffffff; stroke: #e8eaed; stroke-width: 1; }
      .btn-primary { fill: #1a73e8; }
      .btn-primary-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .btn-secondary { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
      .btn-secondary-text { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
      .eyebrow { fill: #1a73e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
      .h1 { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 700; letter-spacing: -0.8px; }
      .h2 { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.4px; }
      .h3 { fill: #1a73e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; }
      .h4 { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15.5px; font-weight: 700; }
      .job-title { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; }
      .body { fill: #5f6368; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; }
      .body-sm { fill: #5f6368; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; }
      .body-xs { fill: #5f6368; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; }
      .text-dark { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; }
      .text-bold { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .faint { fill: #80868b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; }
      .mono-blue { fill: #1a73e8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
      .mono-time { fill: #5f6368; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
      .link { fill: #1a73e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; }
      .green-text { fill: #188038; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .green-circle { fill: #e6f4ea; }
      .green-stroke { stroke: #188038; }
      .blue-box { fill: #e8f0fe; }
      .divider { stroke: #e8eaed; stroke-width: 1; }
      .bullet-grey { fill: #80868b; }
      .bullet-blue { fill: #1a73e8; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #1a1c21; stroke: #2d3135; }
        .card-white { fill: #121316; stroke: #2d3135; }
        .chip { fill: #121316; stroke: #2d3135; }
        .btn-primary { fill: #8ab4f8; }
        .btn-primary-text { fill: #121316; }
        .btn-secondary { fill: #1a1c21; stroke: #3c4043; }
        .btn-secondary-text { fill: #e8eaed; }
        .eyebrow, .h3, .mono-blue, .link { fill: #8ab4f8; }
        .h1, .h2, .h4, .job-title, .text-dark, .text-bold { fill: #e8eaed; }
        .body, .body-sm, .body-xs, .mono-time { fill: #9aa0a6; }
        .faint { fill: #80868b; }
        .green-text { fill: #81c995; }
        .green-circle { fill: #173323; }
        .green-stroke { stroke: #81c995; }
        .blue-box { fill: #1b283f; }
        .divider { stroke: #2d3135; }
        .bullet-blue { fill: #8ab4f8; }
      }
    </style>
  </defs>

  <line x1="24" y1="8" x2="1056" y2="8" class="divider" />

  <!-- Availability Card -->
  <rect x="24" y="36" width="1032" height="290" rx="16" class="card" />

  <circle cx="68" cy="76" r="4" fill="#188038" />
  <text x="82" y="80" class="green-text">Open to opportunities &amp; Master’s programs</text>

  <text x="64" y="122" class="h2">Ready to build reliable <tspan fill="#1a73e8">cloud platforms</tspan> anywhere.</text>

  <text x="64" y="158" class="body">Open to sponsorship, relocation, and remote opportunities across</text>
  <text x="64" y="180" class="body">Cloud Engineering, DevOps, Platform Engineering, and SRE — as well</text>
  <text x="64" y="202" class="body">as Master’s in Computer Science / Information Technology programs.</text>

  <rect x="64" y="232" width="148" height="42" rx="21" class="btn-primary" />
  <text x="138" y="258" text-anchor="middle" class="btn-primary-text">Let's connect ↗</text>

  <rect x="224" y="232" width="154" height="42" rx="21" class="btn-secondary" />
  <text x="301" y="258" text-anchor="middle" class="btn-secondary-text">View experience</text>

